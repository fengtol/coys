name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux relay amd64
            goos: linux
            goarch: amd64
            package: ./cmd/relay
            output: clipboard-relay-linux-amd64
          - name: Linux relay arm64
            goos: linux
            goarch: arm64
            package: ./cmd/relay
            output: clipboard-relay-linux-arm64
          - name: Windows client amd64
            goos: windows
            goarch: amd64
            package: ./cmd/windows-client
            output: clipboard-client-windows-amd64.exe
          - name: Windows client arm64
            goos: windows
            goarch: arm64
            package: ./cmd/windows-client
            output: clipboard-client-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test protocol
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.output }}" "${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-sync-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
